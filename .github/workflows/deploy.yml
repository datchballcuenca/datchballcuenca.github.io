name: Publicar web desde Drive
on:
  push:
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar fotos de la galeria
        run: |
          set -e
          for i in c7_099; do
            rm -f img/galeria/$i.jpg
            sed -i "s#<a href=\"img/galeria/$i.jpg\" class=\"gl\"><img [^>]*></a>##g" club.html
          done
          grep -c 'c7_099' club.html || true
      - name: Guardar en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Quitar otra foto que no es del club

