name: Publicar web desde Drive
on:
  push:
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resultados de la liga
        run: |
          cat > /tmp/patch.py <<'PY'
          import io,os,sys,re,json
          root=sys.argv[1] if len(sys.argv)>1 else '.'
          RES={"1|0|1":[3,5],"1|0|2":[5,2],"1|0|3":[2,5],"1|0|4":[2,5],"1|0|5":[5,3],"1|1|1":[3,5],"1|1|2":[5,3],"1|1|3":[4,3],"1|1|4":[5,2],"1|1|5":[5,2],"1|2|1":[3,5],"1|2|2":[3,1],"1|2|3":[4,3],"1|2|4":[2,5],"1|2|5":[2,5]}
          p=os.path.join(root,'liga','index.html');s=io.open(p,encoding='utf-8').read()
          n,c=re.subn(r'/\*RES\*/const RES=.*?;/\*/RES\*/','/*RES*/const RES='+json.dumps(RES)+';/*/RES*/',s,flags=re.S)
          assert c==1
          n=n.replace('<h1 class="h2">Clasificación por grupo</h1>','<h1 class="h2">Clasificación general</h1>')
          n=n.replace('Una tabla por categoría en cada conferencia, calculada a partir','Clasificación general de cada categoría en cada conferencia (todos los equipos juntos, sin separar por bombos), calculada a partir')
          io.open(p,'w',encoding='utf-8').write(n);print('ok',len(RES))
          PY
          python3 /tmp/patch.py .
      - name: Guardar en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Resultados 1a concentracion Este - ronda 17:00
