name: Publicar web desde Drive
on:
  push:
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resultados de la liga
        run: |
          cat > /tmp/patch.py <<'PY'
          import io,os,sys,re,json
          RES={"1|0|1":[3,5],"1|0|2":[5,2],"1|0|3":[2,5],"1|0|4":[2,5],"1|0|5":[5,3],"1|1|1":[3,5],"1|1|2":[5,3],"1|1|3":[4,3],"1|1|4":[5,2],"1|1|5":[5,2],"1|2|1":[3,5],"1|2|2":[3,1],"1|2|3":[4,3],"1|2|4":[2,5],"1|2|5":[2,5],"1|3|1":[4,3],"1|3|2":[5,4],"1|3|3":[2,5],"1|3|4":[4,3],"1|3|5":[4,2],"1|4|1":[4,2],"1|4|2":[2,5],"1|4|3":[3,5],"1|4|4":[5,2],"1|4|5":[5,2],"1|5|1":[4,5],"1|5|2":[3,5],"1|5|3":[5,4],"1|5|4":[5,3],"1|5|5":[5,2]}
          p=os.path.join('.','liga','index.html');s=io.open(p,encoding='utf-8').read()
          n,c=re.subn(r'/\*RES\*/const RES=.*?;/\*/RES\*/','/*RES*/const RES='+json.dumps(RES)+';/*/RES*/',s,flags=re.S)
          assert c==1;io.open(p,'w',encoding='utf-8').write(n);print('ok',len(RES))
          PY
          python3 /tmp/patch.py
      - name: Guardar en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Resultados 1a concentracion Este - ronda 18:30
