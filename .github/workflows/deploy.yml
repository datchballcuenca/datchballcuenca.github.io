name: Publicar web desde Drive
on:
  push:
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar fotos de la galeria
        run: |
          set -e
          for i in c7_000 c7_054 c7_063 c7_094 c7_102; do
            rm -f img/galeria/$i.jpg
            sed -i "s#<a href=\"img/galeria/$i.jpg\" class=\"gl\"><img [^>]*></a>##g" club.html
          done
          grep -c 'c7_000\|c7_054\|c7_063\|c7_094\|c7_102' club.html || true
      - name: Guardar en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Quitar fotos que no son del club
