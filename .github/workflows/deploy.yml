name: Publicar web desde Drive
on:
  push:
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Braga sin talla
        run: |
          python3 -c "a='Braga%20de%20cuello%20Datchball%0ACantidad%3A%20%0ATalla%20y%20modalidad%20%28ni%C3%B1o/a%20o%20adulto%29%3A%20%0A';b='Braga%20de%20cuello%20Datchball%0ACantidad%3A%20%0A';s=open('tienda.html',encoding='utf-8').read();print('cambios',s.count(a));open('tienda.html','w',encoding='utf-8').write(s.replace(a,b))"
      - name: Guardar en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Braga sin talla en el correo de reserva
