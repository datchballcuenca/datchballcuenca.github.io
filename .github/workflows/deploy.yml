name: Publicar web desde Drive
on:
  push:
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resultados de la liga
        run: |
          cat > /tmp/patch.py <<'PY'
          import io,os,sys,re,json
          root=sys.argv[1] if len(sys.argv)>1 else '.'
          RES={"1|0|1":[3,5],"1|0|2":[5,2],"1|0|3":[2,5],"1|0|4":[2,5],"1|0|5":[5,3]}
          p=os.path.join(root,'liga','index.html');s=io.open(p,encoding='utf-8').read()
          block='<script id="resultados">/*RES*/const RES='+json.dumps(RES)+';/*/RES*/</script>\n'
          if '/*RES*/' in s:
              s=re.sub(r'<script id="resultados">/\*RES\*/.*?/\*/RES\*/</script>\n',lambda m:block,s,flags=re.S)
          else:
              i=s.index('<script>\nconst PAY=') if '<script>\nconst PAY=' in s else s.index('<script>')
              s=s[:i]+block+s[i:]
          def rep(start,new):
              global s
              i=s.index(start);e=s.index('\nfunction',i+10);s=s[:i]+new+s[e:]
          GC=r'''function gameCard(m,showScore){const a=TM[m.a],b=TM[m.b];const mine=!st.school||schoolKey(a.s)===st.school||schoolKey(b.s)===st.school;
            const r=(typeof RES!=='undefined')&&RES[m.j+'|'+m.h+'|'+m.p];const sa=r?r[0]:'–',sb=r?r[1]:'–';const wa=r&&r[0]>r[1],wb=r&&r[1]>r[0];
            return `<article class="game ${mine?'':'dim'} ${r?'done':''}" style="--cc:var(--c${m.c})"><div class="gh"><span class="cat">${CAT[m.c]} · Jornada ${m.r}</span><span>${r?'<b class="fin">Finalizado</b> · ':''}${hm(m.h)} · Pista ${m.p}</span></div>
            <div class="tm ${wa?'win':''}"><img src="${logo(a)}" alt=""><b>${esc(a.n)}</b>${showScore||r?`<span class="sc">${sa}</span>`:''}</div><div class="vs">CONTRA</div>
            <div class="tm ${wb?'win':''}"><img src="${logo(b)}" alt=""><b>${esc(b.n)}</b>${showScore||r?`<span class="sc">${sb}</span>`:''}</div></article>`}'''
          VR=r'''function vResultados(){
            const has=m=>(typeof RES!=='undefined')&&RES[m.j+'|'+m.h+'|'+m.p];
            const ms=M.filter(m=>m.j===st.conc&&(!st.cat||m.c===st.cat)&&(!st.school||schoolKey(TM[m.a].s)===st.school||schoolKey(TM[m.b].s)===st.school));
            const done=ms.filter(has);const hs=[...new Set(done.map(m=>m.h))].sort((a,b)=>b-a);const pend=ms.length-done.length;
            return `<section class="view"><div><span class="eyebrow">Resultados</span><h1 class="h2">Resultados por concentración</h1><p class="lead">Marcador de cada partido. Se actualiza al terminar cada ronda; en directo, en <a href="https://copafacil.com/-34f3w" target="_blank" rel="noopener">Copa Fácil</a>.</p></div>
            ${concSeg()}<div class="bar">${schoolSelect('fs')}${catSelect('fc')}</div>
            ${done.length?hs.map(h=>`<h2 style="font-family:var(--cond);font-weight:800;font-size:22px;margin:6px 0 10px">Ronda de las ${hm(h)} · ${fmtDate(st.conc)}</h2><div class="games">${done.filter(m=>m.h===h).sort((a,b)=>a.p-b.p).map(m=>gameCard(m,true)).join('')}</div>`).join(''):`<div class="empty"><b>Aún no hay resultados de la ${ORD[st.conc]} concentración</b>${DATES[st.conc]?'Se jugará el '+fmtDate(st.conc)+'.':''} Aquí aparecerá el marcador de cada partido al terminar cada ronda.</div>`}
            ${done.length&&pend?`<p class="note">Quedan ${pend} partidos por jugar en esta concentración${st.cat||st.school?' con este filtro':''}. Se irán publicando al terminar cada ronda.</p>`:''}
            </section>`}'''
          VC=r'''function vClasif(){
            const k=st.confT;const groups=CATS.filter(c=>!st.cat||c===st.cat);const R=(typeof RES!=='undefined')?RES:{};
            const tab=c=>{const ts=D.teams.filter(t=>t.k===k&&t.c===c);const T={};ts.forEach(t=>T[t.id]={t,pj:0,v:0,e:0,d:0,f:0,ec:0,pts:0});
             M.filter(m=>m.c===c&&m.conf===k).forEach(m=>{const r=R[m.j+'|'+m.h+'|'+m.p];if(!r||!T[m.a]||!T[m.b])return;const A=T[m.a],B=T[m.b];
              A.pj++;B.pj++;A.f+=r[0];A.ec+=r[1];B.f+=r[1];B.ec+=r[0];
              if(r[0]>r[1]){A.v++;B.d++;A.pts+=3}else if(r[1]>r[0]){B.v++;A.d++;B.pts+=3}else{A.e++;B.e++;A.pts++;B.pts++}});
             return Object.values(T).sort((x,y)=>y.pts-x.pts||(y.f-y.ec)-(x.f-x.ec)||y.f-x.f||x.t.n.localeCompare(y.t.n,'es'))};
            const any=Object.keys(R).length>0;
            return `<section class="view"><div><span class="eyebrow">Clasificación</span><h1 class="h2">Clasificación por grupo</h1><p class="lead">Una tabla por categoría en cada conferencia, calculada a partir de los resultados publicados: 3 puntos por victoria y 1 por empate. Desempate: diferencia de eliminados y eliminados a favor.</p></div>
            <div class="bar"><div class="seg" role="group" aria-label="Conferencia">${['E','O'].map(x=>`<button data-conf="${x}" aria-pressed="${k===x}">Conferencia ${CONF[x]}</button>`).join('')}</div>${catSelect('fc')}</div>
            ${groups.map(c=>{const rows=tab(c);
             return `<div><h2 style="font-family:var(--cond);font-weight:800;font-size:24px;margin-bottom:8px"><span class="chip ${c}">${CAT[c]}</span> Conferencia ${CONF[k]} · ${rows.length} equipos</h2>
             <div class="tblwrap"><table><thead><tr><th class="pos">#</th><th>Equipo</th><th>PJ</th><th>V</th><th>E</th><th>D</th><th title="Eliminados a favor">EF</th><th title="Eliminados en contra">EC</th><th title="Diferencia">DIF</th><th>Puntos</th></tr></thead><tbody>
             ${rows.map((x,i)=>`<tr><td class="pos">${x.pj?i+1:'–'}</td><td class="team"><img src="${logo(x.t)}" alt="">${esc(x.t.n)}</td><td class="n">${x.pj}</td><td class="n">${x.v}</td><td class="n">${x.e}</td><td class="n">${x.d}</td><td class="n">${x.f}</td><td class="n">${x.ec}</td><td class="n">${x.f-x.ec>0?'+':''}${x.f-x.ec}</td><td class="n"><b>${x.pts}</b></td></tr>`).join('')}
             </tbody></table></div></div>`}).join('')}
            <p class="note">${any?'Clasificación provisional: se actualiza al terminar cada ronda. En directo, en <a href="https://copafacil.com/-34f3w" target="_blank" rel="noopener">Copa Fácil</a>.':'La competición empieza el 27 de noviembre: hasta entonces todos los equipos están a cero.'}</p></section>`}'''
          rep('function gameCard',GC);rep('function vResultados',VR);rep('function vClasif',VC)
          CSS='''
          .game.done .tm .sc{font-family:var(--display);font-size:30px;line-height:1;min-width:34px;text-align:right}
          .game .tm.win b{font-weight:800}.game .tm.win .sc{color:#16a34a}
          .game .fin{color:#16a34a;text-transform:uppercase;font-size:12px;letter-spacing:1px}
          '''
          if '.game.done' not in s:
              k=s.index('</style>');s=s[:k]+CSS+s[k:]
          io.open(p,'w',encoding='utf-8').write(s);print('ok',len(RES),'resultados')
          PY
          python3 /tmp/patch.py .
      - name: Guardar en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Resultados 1a concentracion Este - ronda 16:00
