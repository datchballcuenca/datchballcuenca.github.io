function vResultados(){
  const has=m=>(typeof RES!=='undefined')&&RES[m.j+'|'+m.h+'|'+m.p];
  const ms=M.filter(m=>m.j===st.conc&&(!st.cat||m.c===st.cat)&&(!st.school||schoolKey(TM[m.a].s)===st.school||schoolKey(TM[m.b].s)===st.school));
  const done=ms.filter(has);const hs=[...new Set(done.map(m=>m.h))].sort((a,b)=>b-a);const pend=ms.length-done.length;
  return `<section class="view"><div><span class="eyebrow">Resultados</span><h1 class="h2">Resultados por concentración</h1><p class="lead">Marcador de cada partido. Se actualiza al terminar cada ronda; en directo, en <a href="https://copafacil.com/-34f3w" target="_blank" rel="noopener">Copa Fácil</a>.</p></div>
  ${concSeg()}<div class="bar">${schoolSelect('fs')}${catSelect('fc')}</div>
  ${done.length?hs.map(h=>`<h2 style="font-family:var(--cond);font-weight:800;font-size:22px;margin:6px 0 10px">Ronda de las ${hm(h)} · ${fmtDate(st.conc)}</h2><div class="games">${done.filter(m=>m.h===h).sort((a,b)=>a.p-b.p).map(m=>gameCard(m,true)).join('')}</div>`).join(''):`<div class="empty"><b>Aún no hay resultados de la ${ORD[st.conc]} concentración</b>${DATES[st.conc]?'Se jugará el '+fmtDate(st.conc)+'.':''} Aquí aparecerá el marcador de cada partido al terminar cada ronda.</div>`}
  ${done.length&&pend?`<p class="note">Quedan ${pend} partidos por jugar en esta concentración${st.cat||st.school?' con este filtro':''}. Se irán publicando al terminar cada ronda.</p>`:''}
  </section>`}
function vClasif(){
  const k=st.confT;const groups=CATS.filter(c=>!st.cat||c===st.cat);const R=(typeof RES!=='undefined')?RES:{};
  const tab=c=>{const ts=D.teams.filter(t=>t.k===k&&t.c===c);const T={};ts.forEach(t=>T[t.id]={t,pj:0,v:0,e:0,d:0,f:0,ec:0,pts:0});
   M.filter(m=>m.c===c&&m.conf===k).forEach(m=>{const r=R[m.j+'|'+m.h+'|'+m.p];if(!r||!T[m.a]||!T[m.b])return;const A=T[m.a],B=T[m.b];
    A.pj++;B.pj++;A.f+=r[0];A.ec+=r[1];B.f+=r[1];B.ec+=r[0];
    if(r[0]>r[1]){A.v++;B.d++;A.pts+=3}else if(r[1]>r[0]){B.v++;A.d++;B.pts+=3}else{A.e++;B.e++;A.pts++;B.pts++}});
   return Object.values(T).sort((x,y)=>y.pts-x.pts||(y.f-y.ec)-(x.f-x.ec)||y.f-x.f||x.t.n.localeCompare(y.t.n,'es'))};
  const any=Object.keys(R).length>0;
  return `<section class="view"><div><span class="eyebrow">Clasificación</span><h1 class="h2">Clasificación general</h1><p class="lead">Clasificación general de cada categoría en cada conferencia (todos los equipos juntos, sin separar por bombos), calculada a partir de los resultados publicados: 3 puntos por victoria y 1 por empate. Desempate: diferencia de eliminados y eliminados a favor.</p></div>
  <div class="bar"><div class="seg" role="group" aria-label="Conferencia">${['E','O'].map(x=>`<button data-conf="${x}" aria-pressed="${k===x}">Conferencia ${CONF[x]}</button>`).join('')}</div>${catSelect('fc')}</div>
  ${groups.map(c=>{const rows=tab(c);
   return `<div><h2 style="font-family:var(--cond);font-weight:800;font-size:24px;margin-bottom:8px"><span class="chip ${c}">${CAT[c]}</span> Conferencia ${CONF[k]} · ${rows.length} equipos</h2>
   <div class="tblwrap"><table><thead><tr><th class="pos">#</th><th>Equipo</th><th>PJ</th><th>V</th><th>E</th><th>D</th><th title="Eliminados a favor">EF</th><th title="Eliminados en contra">EC</th><th title="Diferencia">DIF</th><th>Puntos</th></tr></thead><tbody>
   ${rows.map((x,i)=>`<tr><td class="pos">${x.pj?i+1:'–'}</td><td class="team"><img src="${logo(x.t)}" alt="">${esc(x.t.n)}</td><td class="n">${x.pj}</td><td class="n">${x.v}</td><td class="n">${x.e}</td><td class="n">${x.d}</td><td class="n">${x.f}</td><td class="n">${x.ec}</td><td class="n">${x.f-x.ec>0?'+':''}${x.f-x.ec}</td><td class="n"><b>${x.pts}</b></td></tr>`).join('')}
   </tbody></table></div></div>`}).join('')}
  <p class="note">${any?'Clasificación provisional: se actualiza al terminar cada ronda. En directo, en <a href="https://copafacil.com/-34f3w" target="_blank" rel="noopener">Copa Fácil</a>.':'La competición empieza el 27 de noviembre: hasta entonces todos los equipos están a cero.'}</p></section>`}
function vEquipos(){
  const q=(st.q||'').toLowerCase();
  return `<section class="view"><div><span class="eyebrow">Equipos</span><h1 class="h2">74 equipos inscritos</h1><p class="lead">Toca un equipo para ver todos sus partidos de la temporada.</p></div>
  <div class="bar"><div class="field"><label for="fq">Buscar equipo</label><input type="text" id="fq" placeholder="Nombre del equipo" value="${esc(st.q||'')}"></div>${schoolSelect('fs')}${catSelect('fc')}</div>
  ${['E','O'].map(k=>CATS.filter(c=>!st.cat||c===st.cat).map(c=>{const ts=D.teams.filter(t=>t.k===k&&t.c===c&&(!st.school||schoolKey(t.s)===st.school)&&(!q||t.n.toLowerCase().includes(q))).sort((a,b)=>a.pot-b.pot||a.n.localeCompare(b.n,'es'));
    if(!ts.length)return '';return `<div><h2 style="font-family:var(--cond);font-weight:800;font-size:22px;margin-bottom:8px"><span class="chip ${k}">Conferencia ${CONF[k]}</span> <span class="chip ${c}">${CAT[c]}</span></h2><div class="tlist">${ts.map(t=>`<button class="tcard" data-team="${esc(t.id)}"><img src="${logo(t)}" alt=""><span style="min-width:0"><b>${esc(t.n)}</b><span>${esc(school(t))} · Bombo ${t.pot}</span></span></button>`).join('')}</div></div>`}).join('')).join('')}
  </section>`}
function vFotos(){
  return `<section class="view"><div><span class="eyebrow">Fotos</span><h1 class="h2">Galería de las concentraciones</h1><p class="lead">Después de cada tarde, la organización subirá aquí las fotos, ordenadas por concentración.</p></div>
  ${concSeg()}
  <div class="empty"><b>Todavía no hay fotos de la ${ORD[st.conc]} concentración</b>Aparecerán aquí después del ${fmtDate(st.conc)}.</div>
  <div class="grid g3">${[1,2,3].map(i=>`<div class="ph">Hueco para foto ${i}</div>`).join('')}</div>
  <div class="admin"><span class="eyebrow" style="color:var(--fg)">Vista del modo organizador · boceto</span><h3>Subir fotos</h3><p class="note" style="margin:4px 0 12px">Seleccionas las fotos desde el ordenador o el móvil, eliges la concentración y se publican en la galería.</p><div class="row"><button class="btn alt" disabled>Elegir fotos</button><button class="btn" disabled>Publicar en la galería</button></div><p class="note" style="margin:10px 0 0">Recuerda publicar solo fotos con autorización de imagen de las familias.</p></div></section>`}
function vNoticias(){
  return `<section class="view"><div><span class="eyebrow">Noticias</span><h1 class="h2">Noticias de la liga</h1></div>
  <div class="grid g2">
   <article class="card news"><time>18 nov 2026</time><h3>Ya están los horarios de las seis concentraciones</h3><p>La 1ª concentración (Conferencia Este) será el 27 de noviembre y la 2ª (Conferencia Oeste) el 11 de diciembre. En el calendario puedes elegir tu colegio y ver sus partidos resaltados.</p></article>
   <article class="card news"><time>17 nov 2026</time><h3>74 equipos y dos conferencias</h3><p>Ya hay 16 equipos prebenjamines, 26 benjamines y 32 alevines de 12 centros y clubes.</p></article>
  </div>
  <div class="admin"><span class="eyebrow" style="color:var(--fg)">Vista del modo organizador · boceto</span><h3>Publicar una noticia</h3><div class="row" style="margin-top:8px"><input type="text" aria-label="Título" placeholder="Título de la noticia" disabled style="flex:1;min-width:200px"><button class="btn" disabled>Publicar</button></div></div></section>`}
function vInfo(){
  return `<section class="view"><div><span class="eyebrow">Información</span><h1 class="h2">Cómo funciona la liga</h1></div>
  <div class="grid g2">
   <div class="card"><h3 style="font-family:var(--cond);font-weight:800;font-size:22px">Sede y horario</h3><p>Pabellón CEIP Ciudad Encantada. Las tardes empiezan a las 16:00, con 5 pistas y partidos de 30 minutos. Primero juega prebenjamín, después benjamín y por último alevín, así cada equipo juega seguido y puede marcharse al terminar. Conviene llegar 15 minutos antes del primer partido.</p></div>
   <div class="card"><h3 style="font-family:var(--cond);font-weight:800;font-size:22px">Formato</h3><p>Dos conferencias, Este y Oeste. En cada categoría, sistema suizo con bombos: 6 partidos en prebenjamín y 9 en benjamín y alevín, para todos por igual. Los bombos se han hecho sin cabezas de serie; solo separan a los equipos de un mismo centro.</p></div>
   <div class="card"><h3 style="font-family:var(--cond);font-weight:800;font-size:22px">Normas básicas</h3><p>Equipos obligatoriamente mixtos, de 6 a 13 jugadores/as, con 6 en pista (3-3 o 4-2). El partido termina cuando un equipo gana 3 juegos. Cada equipo recibe además una puntuación en valores.</p><p><a href="../docs/Reglamento_Oficial_Datchball_2026-27.pdf" download>Reglamento oficial 2026/27</a> · <a href="../docs/Normativa_Liga_Datchball_Cuenca_2026-27.pdf" download>Normativa de la liga</a> · <a href="../docs/Hoja_Inscripcion_Equipos_Liga_Datchball_2026-27.pdf" download>Hoja de inscripción</a></p></div>
   <div class="card"><h3 style="font-family:var(--cond);font-weight:800;font-size:22px">Contacto</h3><p>Organización de la Liga Escolar de Datchball de Cuenca.<br><b style="user-select:all">ciudadencantadadeportiva@gmail.com</b></p><p><a href="../contacto.html">Teléfonos y más contacto →</a></p></div>
  </div>
  <div class="card" style="text-align:center"><p style="font-family:var(--cond);font-weight:800;font-size:20px;margin:0">¡Felicita a tu rival al terminar, sin ellos no podrías jugar!</p><p class="note" style="margin:6px 0 0">Agradece a tus compañeros, a tus familiares y a los árbitros: entre todos hacemos que reine el juego limpio.</p></div></section>`}
function teamModal(id){const t=TM[id];const ms=M.filter(m=>m.a===id||m.b===id).sort((a,b)=>a.j-b.j||a.h-b.h);
  document.getElementById('modal').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(t.n)}"><div class="card"><button class="x" aria-label="Cerrar" data-close>×</button>
  <div style="display:flex;gap:12px;align-items:center"><img src="${logo(t)}" alt="" style="width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px"><div><b style="font-family:var(--cond);font-weight:800;font-size:24px;line-height:1.1;display:block">${esc(t.n)}</b><span class="note">${esc(school(t))}</span><div class="stat" style="margin-top:4px"><span class="chip ${t.c}">${CAT[t.c]}</span><span class="chip ${t.k}">Conferencia ${CONF[t.k]}</span><span class="chip">Bombo ${t.pot}</span></div></div></div>
  <div class="tblwrap" style="margin-top:14px"><table><thead><tr><th>Conc.</th><th>Fecha</th><th>Hora</th><th>Pista</th><th>Rival</th></tr></thead><tbody>${ms.map(m=>{const o=TM[m.a===id?m.b:m.a];return `<tr><td>${ORD[m.j]}</td><td>${DATES[m.j]?fmtDate(m.j):'Por confirmar'}</td><td><b>${hm(m.h)}</b></td><td class="n">${m.p}</td><td style="white-space:normal">${esc(o.n)}</td></tr>`}).join('')}</tbody></table></div></div></div>`;}
// ---------- router
function render(){const h=(location.hash||'#inicio').slice(1);st.view=VIEWS.some(v=>v[0]===h)?h:'inicio';menu();
  const f={inicio:vInicio,calendario:vCalendario,resultados:vResultados,clasificacion:vClasif,equipos:vEquipos,fotos:vFotos,noticias:vNoticias,info:vInfo}[st.view];
  document.getElementById('app').innerHTML=f();bind();tick();}
function bind(){
  document.querySelectorAll('[data-conc]').forEach(b=>b.onclick=()=>{st.conc=+b.dataset.conc;save();render()});
  document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{st.confT=b.dataset.conf;render()});
  document.querySelectorAll('[data-goconf]').forEach(b=>b.onclick=()=>{st.conc=b.dataset.goconf==='E'?1:2;save()});
  const fs=document.getElementById('fs');if(fs)fs.onchange=()=>{st.school=fs.value;save();render()};
  const fc=document.getElementById('fc');if(fc)fc.onchange=()=>{st.cat=fc.value;render()};
  const fq=document.getElementById('fq');if(fq)fq.oninput=()=>{st.q=fq.value;const pos=fq.selectionStart;render();const n=document.getElementById('fq');n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>teamModal(b.dataset.team));
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.matches('[data-close]')||e.target.classList.contains('modal'))e.currentTarget.innerHTML=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').innerHTML=''});
function tick(){const el=document.getElementById('count');if(!el)return;const d=Math.max(0,new Date(2026,10,27,16,0)-new Date());const dd=Math.floor(d/864e5),hh=Math.floor(d%864e5/36e5),mm=Math.floor(d%36e5/6e4);
  el.innerHTML=[[dd,'días'],[hh,'horas'],[mm,'min']].map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}
setInterval(tick,30000);
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
render();
</script>


</body></html>
